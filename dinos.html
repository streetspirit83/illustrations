<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometrische Dinosaurier-Landschaft</title>
    <style>
        :root {
            --carnivore: #c0392b;
            --herbivore: #27ae60;
            --flyer: #2471a3;
            --accent: #e67e22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a120a;
            padding: 20px 16px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
            text-shadow: 0 0 24px rgba(230,126,34,0.35);
        }

        /* ── Map ── */
        .map-container {
            position: relative;
            max-width: 1100px;
            width: 100%;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            line-height: 0;
        }

        .map-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ── Hotspot (label on image) ── */
        .hotspot {
            position: absolute;
            transform: translate(-50%, -100%);
            cursor: pointer;
            z-index: 5;
        }

        .hotspot-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(6, 14, 6, 0.82);
            border: 1px solid rgba(230,126,34,0.5);
            border-radius: 3px;
            padding: 2px 7px;
            color: #eee;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
            backdrop-filter: blur(3px);
        }

        .hotspot.active .hotspot-label,
        .hotspot:hover .hotspot-label {
            background: var(--accent);
            color: #0d1a0d;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-c { background: var(--carnivore); }
        .dot-h { background: var(--herbivore); }
        .dot-f { background: var(--flyer); }

        /* pin line */
        .hotspot::after {
            content: '';
            display: block;
            width: 1px;
            height: 8px;
            background: var(--accent);
            margin: 0 auto;
            opacity: 0.6;
        }

        /* ── Info panel below image ── */
        .info-panel {
            max-width: 1100px;
            width: 100%;
            background: #1a2b1a;
            border: 1px solid rgba(230,126,34,0.5);
            border-top: 3px solid var(--accent);
            border-radius: 0 0 10px 10px;
            padding: 20px 24px;
            min-height: 110px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .info-placeholder {
            color: #aaa;
            font-size: 13px;
            text-align: center;
            padding: 24px 0 16px;
            letter-spacing: 0.5px;
        }

        .info-content { display: none; }
        .info-content.visible { display: block; }

        .info-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .info-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 3px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .b-carnivore { background: var(--carnivore); color: #fff; }
        .b-herbivore { background: var(--herbivore); color: #fff; }
        .b-flyer     { background: var(--flyer);     color: #fff; }
        .b-period    { background: #2e1e0d; color: #f5cba7; }

        .info-art {
            font-size: 11px;
            color: #888;
            font-style: italic;
            margin-bottom: 10px;
        }

        .info-desc {
            font-size: 13px;
            color: #ccc;
            line-height: 1.6;
            border-top: 1px solid rgba(230,126,34,0.18);
            padding-top: 10px;
        }

        /* ── Legend ── */
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            color: #666;
            font-size: 11px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot  { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body>

<h1>🦕 Dinosaurier-Landschaft — Interaktive Karte</h1>

<div class="map-container">
    <img src="1778952904558.png" alt="Isometrische Dinosaurier-Landschaft" class="map-image">

    <div class="hotspot" style="left:8%;top:32%;" data-id="brachiosaurus">
        <div class="hotspot-label"><span class="dot dot-h"></span>Brachiosaurus</div>
    </div>

    <div class="hotspot" style="left:33%;top:52%;" data-id="trex">
        <div class="hotspot-label"><span class="dot dot-c"></span>T-Rex</div>
    </div>

    <div class="hotspot" style="left:39%;top:68%;" data-id="triceratops">
        <div class="hotspot-label"><span class="dot dot-h"></span>Triceratops</div>
    </div>

    <div class="hotspot" style="left:56%;top:13%;" data-id="pteranodon">
        <div class="hotspot-label"><span class="dot dot-f"></span>Pteranodon</div>
    </div>

    <div class="hotspot" style="left:74%;top:38%;" data-id="velociraptor">
        <div class="hotspot-label"><span class="dot dot-c"></span>Velociraptor</div>
    </div>

    <div class="hotspot" style="left:65%;top:57%;" data-id="stegosaurus">
        <div class="hotspot-label"><span class="dot dot-h"></span>Stegosaurus</div>
    </div>

    <div class="hotspot" style="left:51%;top:72%;" data-id="ankylosaurus">
        <div class="hotspot-label"><span class="dot dot-h"></span>Ankylosaurus</div>
    </div>

    <div class="hotspot" style="left:80%;top:70%;" data-id="spinosaurus">
        <div class="hotspot-label"><span class="dot dot-c"></span>Spinosaurus</div>
    </div>
</div>

<!-- Info panel rendered below the image -->
<div class="info-panel" id="infoPanel">
    <div class="info-placeholder" id="infoPlaceholder">← Klicke auf einen Dinosaurier, um mehr zu erfahren</div>
    <div class="info-content" id="infoContent">
        <div class="info-name"    id="infoName"></div>
        <div class="info-badges"  id="infoBadges"></div>
        <div class="info-art"     id="infoArt"></div>
        <div class="info-desc"    id="infoDesc"></div>
    </div>
</div>

<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--carnivore)"></div>Fleischfresser</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--herbivore)"></div>Pflanzenfresser</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--flyer)"></div>Flugsaurier</div>
</div>

<script>
const DATA = {
    brachiosaurus: {
        name: "Brachiosaurus",
        dietClass: "b-herbivore", dietLabel: "Pflanzenfresser",
        periode: "Später Jura",
        art: "Sauropode",
        desc: "Ein gigantischer Langhals-Dinosaurier. Seine vorderen Gliedmaßen waren länger als die hinteren, was ihm das Erreichen hoher Baumwipfel ermöglichte."
    },
    trex: {
        name: "Tyrannosaurus Rex",
        dietClass: "b-carnivore", dietLabel: "Fleischfresser",
        periode: "Späte Kreidezeit",
        art: "Theropode",
        desc: "Der König der Echsen. Ein massiver, zweibeiniger Fleischfresser mit einem kraftvollen Kiefer und stark reduzierten Vorderarmen."
    },
    triceratops: {
        name: "Triceratops",
        dietClass: "b-herbivore", dietLabel: "Pflanzenfresser",
        periode: "Späte Kreidezeit",
        art: "Ceratopsidae",
        desc: "Ein robuster Vierbeiner, bekannt für sein markantes Nackenschild und die drei markanten Hörner im Gesicht zur Verteidigung."
    },
    pteranodon: {
        name: "Pteranodon",
        dietClass: "b-flyer", dietLabel: "Flugsaurier",
        periode: "Späte Kreidezeit",
        art: "Pterosauria",
        desc: "Kein echter Dinosaurier, aber ein fliegendes Reptil dieser Ära. Besaß eine immense Flügelspannweite und einen zahnlosen Schnabel."
    },
    velociraptor: {
        name: "Velociraptor",
        dietClass: "b-carnivore", dietLabel: "Fleischfresser",
        periode: "Späte Kreidezeit",
        art: "Dromaeosauridae",
        desc: "Ein kleiner, extrem agiler und intelligenter Jäger, der wahrscheinlich im Rudel jagte. Besaß eine sichelförmige Kralle an den Füßen."
    },
    stegosaurus: {
        name: "Stegosaurus",
        dietClass: "b-herbivore", dietLabel: "Pflanzenfresser",
        periode: "Später Jura",
        art: "Thyreophora",
        desc: "Leicht erkennbar an der doppelten Reihe großer, knöcherner Platten auf dem Rücken und den gefährlichen Stacheln am Schwanzende (Thagomizer)."
    },
    ankylosaurus: {
        name: "Ankylosaurus",
        dietClass: "b-herbivore", dietLabel: "Pflanzenfresser",
        periode: "Späte Kreidezeit",
        art: "Ankylosauria",
        desc: "Der „lebende Panzer". Sein Körper war mit schweren Knochenplatten bedeckt, und sein Schwanz endete in einer massiven Knochenkeule."
    },
    spinosaurus: {
        name: "Spinosaurus",
        dietClass: "b-carnivore", dietLabel: "Fleischfresser",
        periode: "Kreidezeit",
        art: "Spinosauridae",
        desc: "Einer der größten bekannten Fleischfresser, charakterisiert durch ein riesiges Segel auf dem Rücken und eine Lebensweise, die stark an Gewässer angepasst war."
    }
};

const placeholder = document.getElementById('infoPlaceholder');
const content     = document.getElementById('infoContent');
const elName      = document.getElementById('infoName');
const elBadges    = document.getElementById('infoBadges');
const elArt       = document.getElementById('infoArt');
const elDesc      = document.getElementById('infoDesc');

let activeHotspot = null;

document.querySelectorAll('.hotspot').forEach(el => {
    el.addEventListener('click', () => {
        const id = el.dataset.id;
        const d  = DATA[id];
        if (!d) return;

        // toggle off if same label clicked twice
        if (activeHotspot === el) {
            el.classList.remove('active');
            activeHotspot = null;
            placeholder.style.display = '';
            content.classList.remove('visible');
            return;
        }

        if (activeHotspot) activeHotspot.classList.remove('active');
        el.classList.add('active');
        activeHotspot = el;

        elName.textContent = d.name;
        elBadges.innerHTML =
            `<span class="badge ${d.dietClass}">${d.dietLabel}</span>` +
            `<span class="badge b-period">${d.periode}</span>`;
        elArt.textContent  = d.art;
        elDesc.textContent = d.desc;

        placeholder.style.display = 'none';
        content.classList.add('visible');

        // scroll info panel into view smoothly
        document.getElementById('infoPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
});
</script>
</body>
</html>
